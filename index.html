<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKWorld即時集計表</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="titleRow">
        <h1 class="title">MKWorld即時集計表</h1>
        <button id="btnSpec" class="pill btnPressAction" tabindex="-1">サイトの使い方</button>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="cardHead">
          <div class="cardTitle">ルール設定</div>
        </div>
        <div class="ruleGrid">
          <div class="ruleCol">
            <div class="ruleLine">
              <span class="label">対戦人数</span>
              <label class="radio"><input type="radio" name="players" value="12">12人制</label>
              <label class="radio"><input type="radio" name="players" value="24" checked>24人制</label>
            </div>
            <div class="ruleLine">
              <span class="label">対戦形式</span>
              <select id="selMode" class="sel"></select>
            </div>
            <div class="ruleLine">
              <span class="label">レース数</span>
              <label class="radio"><input type="radio" name="races" value="12" checked>12レース</label>
              <label class="radio"><input type="radio" name="races" value="16">16レース</label>
            </div>
          </div>
          <div class="ruleCol">
            <div class="ruleLine">
              <span class="label">自枠設定</span>
              <select id="selSelfTeam" class="sel"></select>
            </div>
            <div class="ruleLine cpuBox">
              <span class="label">CPU所属</span>
              <select id="selCpuTeam" class="sel"></select>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="cardHead">
          <div class="cardTitle">タグ設定</div>
          <div class="cardActions">
            <label class="chk"><input id="chkUseColor" type="checkbox" checked>カラー表示</label>
            <label class="chk"><input id="chkSortTag" type="checkbox" checked>アルファベット順ソート</label>
          </div>
        </div>
        <div id="tagMainRow" class="tagMainRow colorOn">
          <div class="tagTableWrap">
            <div id="tagTables" class="tagTables"></div>
          </div>
          <div id="cpuInlineWrap" class="cpuInlineWrap"></div>
        </div>
      </section>

      <section class="card rankCard">
        <div class="cardHead">
          <div class="cardTitleRow">
            <div class="cardTitle">順位入力</div>
            <div id="errMain" class="errInline"></div>
          </div>
          <div class="cardActions resetActionStack">
            <button id="btnRecovery" class="btn btnRecovery" disabled tabindex="-1">1つ戻す</button>
            <button id="btnReset" class="btn btnResetAction" tabindex="-1">全消去</button>
          </div>
        </div>

        <div id="pinPreview" class="pinPreview"></div>

        <div class="smallLine smallLineTight">
          ※各マスの入力はキーボードの「1〜9、0（10位）、-（11位）、^（12位）」に対応しています。BackspaceやDeleteで消去できます。
        </div>

        <div id="rankWrap" class="rankWrap"></div>
      </section>

      <section class="card cardLast">
        <div class="cardHead">
          <div class="cardTitle">出力設定</div>
          <div class="cardActions">
            <span id="copyStatusMsg" class="copyStatusMsg"></span>
          </div>
        </div>

        <div class="resultMainPlain">
        <div class="resultMainHead">
          <button id="btnCopyPlain" class="btn btnCopyAction" tabindex="-1">集計結果をコピー</button>
          <button id="btnPin" class="btn btnPressAction" tabindex="-1">上部にピン留め</button>
          <label class="chk"><input id="chkShowCert" type="checkbox">進行証明を出力</label>
        </div>
        <div class="copyLine">
          <div id="outPlain" class="outLine outWrap"></div>
        </div>
        </div>

        <div class="resultGroup resultGroupOther">
        <div class="optionRow">
          <div class="optTitle">個別出力</div>
          <button id="btnCopyOpt" class="btn btnCopyAction" tabindex="-1">copy</button>
          <select id="selView" class="sel"></select>
        </div>

        <div class="copyLine">
          <div id="outOpt" class="outLine outWrap"></div>
        </div>

        </div>

        <div class="divider"></div>

        <div class="resultGroup resultGroupLogs">
        <div class="logBlock">
          <div class="logTitle">点数補正ログ</div>
          <div id="logAdj" class="log"></div>
        </div>

        <div class="logBlock">
          <div class="logTitle">コース選択ログ</div>
          <label class="chk small"><input id="chkShowCourseLog" type="checkbox">表示</label>
          <div id="logCourse" class="log"></div>
        </div>
        </div>
      </section>
    </main>
  </div>

  <div id="pinBar" class="pinBar hidden" aria-hidden="true">
    <div class="pinBarInner">
      <div id="pinBarContent" class="pinBarContent"></div>
      <button id="btnPinClose" class="pinClose" aria-label="閉じる" tabindex="-1">×</button>
    </div>
  </div>

  <div id="modalSpec" class="modal hidden" aria-hidden="true">
    <div class="modalBack"></div>
    <div class="modalBox">
      <div class="modalHead">
        <div class="modalTitle">サイトの使い方</div>
        <button id="btnSpecClose" class="pinClose" aria-label="閉じる" tabindex="-1">×</button>
      </div>
      <div class="modalBody">
        <div class="specText">
          ここに使い方の説明テキストが入ります。
        </div>
      </div>
    </div>
  </div>
</body>
</html>
