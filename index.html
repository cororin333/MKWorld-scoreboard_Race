<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MKWorld即時集計表</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="titleRow">
        <h1 class="title">MKWorld即時集計表</h1>
        <button id="btnSpec" class="pill btnPressAction" tabindex=\"-1\">サイトの使い方</button>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="cardHead">
          <div class="cardTitle">ルール設定</div>
        </div>
        <div class="ruleGrid">
          <div class="ruleCol">
            <div class="ruleLine">
              <span class="label">対戦人数</span>
              <label class="radio"><input type="radio\" name="players" value="12">12人制</label>
              <label class="radio"><input type="radio\" name="players" value="24" checked>24人制</label>
            </div>
            <div class="ruleLine">
              <span class="label">対戦形式</span>
              <select id="selMode" class="sel"></select>
            </div>
            <div class="ruleLine">
              <span class="label">レース数</span>
              <label class="radio"><input type="radio\" name="races" value="12" checked>12</label>
              <label class="radio"><input type="radio\" name="races" value="16">16</label>
              <label class="radio"><input type="radio\" name="races" value="24">24</label>
              <label class="radio"><input type="radio\" name="races" value="32">32</label>
              <label class="radio"><input type="radio\" name="races" value="48">48</label>
            </div>
          </div>
          <div class="ruleCol">
            <div class="ruleLine">
              <span class="label">補正係数</span>
              <input id="inpK" class="inp small" type="text" value="0" maxlength="4" autocomplete="off">
              <span class="smallLine">※少数可・マイナス可</span>
            </div>
            <div class="ruleLine">
              <span class="label">CPU</span>
              <div class="cpuBox">
                <label class="chk"><input id="chkCpu" type="checkbox">CPUを含める</label>
                <div id="cpuNumWrap" class="hidden">
                  <select id="selCpuNum" class="sel"></select>
                </div>
              </div>
            </div>
            <div class="ruleLine">
              <span class="label">色自動割当</span>
              <label class="chk"><input id="chkAutoColor" type="checkbox" checked>順位表のタグに自動で色を付ける</label>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="cardHead">
          <div class="cardTitleRow">
            <div class="cardTitle">タグ設定</div>
            <div id="tagErr" class="errInline"></div>
          </div>
        </div>

        <div class="tagWrap">
          <div id="tagMainRow" class="tagMainRow colorOn">
            <div id="tagTablesCol" class="tagTablesCol"></div>
            <div id="cpuInlineSection" class="cpuInlineWrap hidden"></div>
          </div>
        </div>
      </section>

      <section class="card rankCard">
        <div class="cardHead">
          <div class="cardTitle">順位表</div>
          <div class="cardActions resetActionStack">
            <button id="btnPin" class="btn btnPressAction" tabindex="-1">ピン留め</button>
            <button id="btnRecovery" class="btn btnRecovery" disabled tabindex="-1">データ復旧</button>
            <button id="btnReset" class="btn btnResetAction" tabindex="-1">リセット</button>
          </div>
        </div>

        <div id="pinPreviewRow" class="pinRow hidden">
          <div class="smallLine smallLineTight">ピン留めプレビュー</div>
          <div id="pinPreview" class="pinPreview"></div>
        </div>

        <div id="rankWrap" class="rankWrap"></div>
        <div id="rankErr" class="errInline"></div>
        <div class="smallLine">※各マスの入力は半角英数字（大文字小文字不問）のタグキー、または直接数字を入力してください。</div>
      </section>

      <section class="card cardLast">
        <div class="cardHead">
          <div class="cardTitle">集計結果</div>
          <div class="cardActions">
            <div id="copyMsg" class="copyStatusMsg"></div>
          </div>
        </div>

        <div class="resultGroup resultGroupOther">
        <div class="resultMainHead">
          <button id="btnCopyPlain" class="btn btnCopyAction" tabindex="-1">copy</button>
          <span id="certText" class="certText hidden">【★交流戦申請用★ 100%確定版】</span>
        </div>

        <div class="resultMainPlain">
          <div class="copyLine">
            <div class="optTitle">形式に合わせた集計</div>
            <div id="outPlain" class="outLine outWrap"></div>
          </div>
          <div class="copyLine">
            <div class="optTitle">最高得点者</div>
            <div id="outMVP" class="outLine outWrap"></div>
          </div>
          <div class="copyLine">
            <div class="optTitle">進行用</div>
            <div id="outProg" class="outLine outWrap"></div>
          </div>
        </div>
        </div>

        <div class="divider"></div>

        <div class="displayOptionBlock">
        <div class="displayOptionLine">
          <label class="chk"><input id="chkShowTeamScore" type="checkbox" checked>各チームの合計点を表示</label>
          <label class="chk"><input id="chkShowIndiv" type="checkbox" checked>個人の総合順位・得点を表示</label>
          <label class="chk"><input id="chkShowCert" type="checkbox">確定版タグを表示</label>
        </div>

        <div class="optionRow">
          <button id="btnCopyOpt" class="btn btnCopyAction" tabindex="-1">copy</button>
          <select id="selView" class="sel"></select>
        </div>

        <div class="copyLine">
          <div id="outOpt" class="outLine outWrap"></div>
        </div>

        </div>

        <div class="divider"></div>

        <div class="resultGroup resultGroupLogs">
        <div class="logBlock">
          <div class="logTitle">点数補正ログ</div>
          <div id="logAdj" class="log"></div>
        </div>

        <div class="logBlock">
          <div class="logTitle">コース選択ログ</div>
          <label class="chk small"><input id="chkShowCourseLog" type="checkbox">表示</label>
          <div id="logCourse" class="log"></div>
        </div>
        </div>
      </section>
    </main>
  </div>

  <div id=\"pinBar\" class=\"pinBar hidden\" aria-hidden=\"true\">
    <div class="pinBarInner">
      <div id="pinBarContent" class="pinBarContent"></div>
      <button id="btnPinClose" class="pinClose" aria-label="閉じる" tabindex="-1">×</button>
    </div>
  </div>

  <div id="modalSpec" class="modal hidden" aria-hidden="true\">
    <div class="modalBack"></div>
    <div class="modalBox">
      <div class="modalHead">
        <div class="modalTitle">サイトの使い方</div>
        <button id="btnSpecClose" class="pinClose" aria-label="閉じる" tabindex="-1">×</button>
      </div>
      <div class="modalBody">
        <div id="specText" class="specText"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
